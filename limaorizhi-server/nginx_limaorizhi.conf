# 狸猫日志售票系统 nginx配置
# 部署：宝塔 网站→设置→配置文件，或include到nginx.conf
# 域名：yiban.yiban.asia

server {
    listen 80;
    server_name yiban.yiban.asia;
    # 强制跳转https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yiban.yiban.asia;

    # SSL证书（宝塔自动配置，或手动指定）
    # ssl_certificate /www/server/panel/vhost/cert/yiban.yiban.asia/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/yiban.yiban.asia/privkey.pem;

    # admin前端静态资源
    root /www/wwwroot/limaorizhi-server/dist;
    index index.html;

    # 前端SPA路由（Vue history模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI数字员工SSE流式聊天接口（必须在通用/admin/之前匹配）
    # SSE需要：HTTP/1.1支持chunked传输、关闭缓冲、长超时防止流式中断
    # client_max_body_size：图片base64编码后体积较大，默认1MB会触发413错误
    location /admin/ai/chat {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI图片生成接口（Pollinations.ai可能耗时较长，设180s超时）
    location /admin/ai/image {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 管理端API反代到后端（8181端口）
    location /admin/ {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 小程序API反代到后端（8181端口）
    location /api/ {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 上传文件（^~ 前缀优先于正则匹配，代理到后端确保文件可访问）
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存 - HTML不缓存，CSS/JS可缓存但必须重新验证（不能immutable，否则更新后浏览器不请求新文件）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
    }
    # HTML不缓存，确保每次都获取最新版本
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 禁止访问敏感文件（.env及所有变体、.git、.htaccess、.htpasswd等）
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
    }
    # 禁止访问配置文件
    location ~ \.(yaml|yml|sql|pem|p12|key)$ {
        deny all;
    }
}
